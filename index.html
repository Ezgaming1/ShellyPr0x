<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launcher</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .launch-btn {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      width: 100%;
    }

    .launch-btn:hover {
      background-color: var(--accent-hover);
    }

    .launch-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Game Launcher</h1>
    <button class="launch-btn" onclick="openBlank()">Launch Shelly</button>
  </div>

  <script>
    function openBlank() {
      // 1. Open new blank tab
      const win = window.open('about:blank', '_blank');

      if (!win) {
        alert('Popup blocked! Please allow popups for this site to launch.');
        return;
      }

      // 2. Configure tab title and favicon cloak (Google Drive disguise)
      win.document.title = 'Google Drive';
      const favicon = win.document.createElement('link');
      favicon.rel = 'icon';
      favicon.href = 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png';
      win.document.head.appendChild(favicon);

      // 3. Reset margins on the blank window's body
      win.document.body.style.margin = '0';
      win.document.body.style.height = '100vh';
      win.document.body.style.overflow = 'hidden';
      win.document.body.style.backgroundColor = '#000000';

      // 4. Create the full-page iframe pointing to shelly.html
      const iframe = win.document.createElement('iframe');
      iframe.src = 'Shelly.html';
      iframe.style.width = '100vw';
      iframe.style.height = '100vh';
      iframe.style.border = 'none';
      iframe.style.outline = 'none';
      iframe.style.display = 'block';

      // Allow audio, full-screen, pointer lock, and scripts
      iframe.allow = 'autoplay; fullscreen; pointer-lock; keyboard';

      // 5. Append iframe to the blank page
      win.document.body.appendChild(iframe);
    }
  </script>

</body>
</html>
